name: agentreions_doubao desktop
on:
  workflow_dispatch:
  push:
    paths:
      - 'agentreions_doubao/**'
      - 'assets/**'
      - 'tests/**'
      - 'desktop_main.py'
      - 'build_*.py'
      - 'requirements*.txt'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'agentreions_doubao/**'
      - 'assets/**'
      - 'tests/**'
      - 'desktop_main.py'
      - 'build_*.py'
      - 'requirements*.txt'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build and verify packaged Windows UI with synthetic data
        run: python build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: agentreions_doubao-Windows-x64
          path: release/agentreions_doubao-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: agentreions_doubao-Windows-UI-verification
          # Only synthetic/empty-data evidence produced by build_windows.py.
          # Source fixtures, databases, qa/, media/ and local-data/ stay excluded.
          path: |
            build/packaged-qa/window.png
            build/packaged-qa/window.fonts.json
            build/packaged-qa/synthetic-tool-details.png
            build/packaged-qa/synthetic-tool-details.fonts.json
            build/packaged-qa/synthetic-ui-acceptance.json
          if-no-files-found: error
          retention-days: 14
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            machine: x86_64
          - runner: macos-15
            arch: arm64
            machine: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Verify native build architecture
        run: |
          build_python="$(python -c 'import build_macos; print(build_macos.PYTHON)')"
          "$build_python" -c "import platform; assert platform.machine() == '${{ matrix.machine }}', platform.machine()"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build and verify app signature
        run: python build_macos.py
      - name: Archive standalone app
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/agentreions_doubao.app release/agentreions_doubao-macOS-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agentreions_doubao-macOS-${{ matrix.arch }}
          path: release/agentreions_doubao-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
